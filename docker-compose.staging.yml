services:
  db:
    volumes:
      - postgres_staging:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=speakwise_staging
    mem_limit: 128m
    restart: unless-stopped

  web:
    ports:
      - "8001:8000"
    env_file:
      - .env.staging
    environment:
      - DB_NAME=speakwise_staging
    mem_limit: 256m
    restart: unless-stopped

  db_worker:
    env_file:
      - .env.staging
    environment:
      - DB_NAME=speakwise_staging
    command: python manage.py db_worker
    mem_limit: 128m
    restart: unless-stopped

volumes:
  postgres_staging:
