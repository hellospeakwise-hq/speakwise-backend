services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME:-speakwise}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-speakwise}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=${DB_NAME:-speakwise}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-speakwise.settings.production}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-default-key}
      - DEBUG=1
    depends_on:
      db:
        condition: service_healthy

  db_worker:
    build: .
    volumes:
      - .:/app
    command: python manage.py db_worker
    environment:
      - DB_NAME=${DB_NAME:-speakwise}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-speakwise.settings.local}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-default-key}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
