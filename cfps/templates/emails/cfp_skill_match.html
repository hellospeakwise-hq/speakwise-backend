<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html dir="ltr" lang="en">
  <head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>New CFP matching your skills</title>
  </head>
  <body style="background-color:#dde3ee;margin:0;padding:0">
    <table border="0" width="100%" cellpadding="0" cellspacing="0" role="presentation" align="center">
      <tr>
        <td style="background-color:#dde3ee;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;margin:0;padding:32px 16px">
          <table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="max-width:600px;background-color:#ffffff;border-radius:16px;margin:0 auto;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.10)">
            <tr>
              <td>
                <table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#ffffff;border-bottom:1px solid #e2e8f0;padding:20px 32px">
                  <tr>
                    <td>
                      <a href="https://speak-wise.live" style="color:#067df7;text-decoration:none" target="_blank">
                        <img alt="SpeakWise" height="30" src="https://speak-wise.live/logo-black.png" style="display:block;outline:none;border:none;margin:0 auto" />
                      </a>
                    </td>
                  </tr>
                </table>
                <table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#2563eb;padding:10px 24px">
                  <tr>
                    <td>
                      <p style="font-size:12px;line-height:24px;color:#ffffff;font-weight:600;letter-spacing:0.05em;margin:0;text-align:center">
                        ✦ A CFP matches your skills ✦
                      </p>
                    </td>
                  </tr>
                </table>
                <table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="padding:36px 40px 32px;text-align:center">
                  <tr>
                    <td>
                      <p style="font-size:11px;line-height:24px;color:#2563eb;font-weight:700;letter-spacing:0.1em;margin:0 0 12px;text-transform:uppercase">
                        Call for Papers
                      </p>
                      <h1 style="color:#0f172a;font-size:30px;font-weight:800;line-height:1.2;margin:0 0 16px">
                        {{ event_name }} is looking for speakers like you.
                      </h1>
                      <p style="font-size:15px;line-height:1.7;color:#475569;margin:0 0 28px">
                        Hi <strong>{{ speaker_name }}</strong>, a new Call for Papers matches your skills
                        (<strong>{{ matched_skills }}</strong>). Submit a talk while the CFP is open.
                      </p>
                      <a href="{{ cfp_url }}" style="line-height:100%;text-decoration:none;display:inline-block;background-color:#2563eb;color:#ffffff;border-radius:50px;font-size:15px;font-weight:700;padding:14px 36px" target="_blank">
                        View CFP
                      </a>
                    </td>
                  </tr>
                </table>
                <table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#0f172a;padding:36px 32px 28px;text-align:center">
                  <tr>
                    <td>
                      <p style="font-size:11px;line-height:1.8;color:#64748b;margin:0">
                        © {% now "Y" %} {{ site_name }}. All rights reserved.
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
